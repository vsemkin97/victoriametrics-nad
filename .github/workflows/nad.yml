name: nad-build

# Builds the NAD fork of single-node VictoriaMetrics.
# Every push to the nad branch builds and tests; a tag like v1.110.0-nad.1 also publishes a GitHub release.
on:
  push:
    branches: [nad]
    tags: ['v*-nad.*']
  pull_request:
    branches: [nad]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet and test modified packages
        env:
          GOFLAGS: -mod=vendor
        run: |
          go vet ./app/vminsert/... ./lib/httpserver/...
          go test -race ./app/vminsert/... ./lib/httpserver/...

      - name: Build victoria-metrics-prod
        # Same static musl build in Docker as upstream release binaries.
        run: make victoria-metrics-prod

      - name: Package
        run: |
          ./bin/victoria-metrics-prod --version
          cd bin
          tar -czf victoria-metrics-linux-amd64-${GITHUB_REF_NAME//\//-}.tar.gz victoria-metrics-prod
          sha256sum victoria-metrics-prod victoria-metrics-linux-amd64-*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: victoria-metrics-prod
          path: |
            bin/victoria-metrics-prod
            bin/*.tar.gz
            bin/checksums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file README_NAD.md \
            bin/victoria-metrics-prod bin/*.tar.gz bin/checksums.txt
